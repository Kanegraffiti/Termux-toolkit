<svg width="100%" height="1800" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
  <style>
    .box {
      fill: #f0f8ff;
      stroke: #4682b4;
      stroke-width: 1;
      rx: 6;
      ry: 6;
    }
    .text {
      font-size: 12px;
      fill: #333;
    }
    .title {
      font-size: 16px;
      font-weight: bold;
      fill: #000;
    }
    .line {
      stroke: #4682b4;
      stroke-width: 1;
    }
  </style>

  <!-- CEO -->
  <rect x="400" y="20" width="180" height="40" class="box"/>
  <text x="490" y="45" class="text" text-anchor="middle">CEO</text>

  <!-- Executive Leadership Team -->
  <rect x="340" y="80" width="300" height="40" class="box"/>
  <text x="490" y="105" class="text" text-anchor="middle">Executive Leadership Team</text>
  <line x1="490" y1="60" x2="490" y2="80" class="line"/>

  <!-- First Row of Execs -->
  <g transform="translate(20, 150)">
    <rect x="0" y="0" width="120" height="30" class="box"/>
    <text x="60" y="20" class="text" text-anchor="middle">CTO</text>

    <rect x="140" y="0" width="120" height="30" class="box"/>
    <text x="200" y="20" class="text" text-anchor="middle">CFO</text>

    <rect x="280" y="0" width="120" height="30" class="box"/>
    <text x="340" y="20" class="text" text-anchor="middle">CMO</text>

    <rect x="420" y="0" width="180" height="30" class="box"/>
    <text x="510" y="20" class="text" text-anchor="middle">IT & Support Director</text>

    <line x1="470" y1="-70" x2="470" y2="0" class="line"/>
  </g>

  <!-- Second Row -->
  <g transform="translate(20, 200)">
    <rect x="0" y="0" width="180" height="30" class="box"/>
    <text x="90" y="20" class="text" text-anchor="middle">Group Finance Manager</text>

    <rect x="200" y="0" width="120" height="30" class="box"/>
    <text x="260" y="20" class="text" text-anchor="middle">HR Manager</text>

    <rect x="340" y="0" width="160" height="30" class="box"/>
    <text x="420" y="20" class="text" text-anchor="middle">Head of Development</text>

    <rect x="520" y="0" width="120" height="30" class="box"/>
    <text x="580" y="20" class="text" text-anchor="middle">Head of PS</text>
  </g>

  <!-- Regional GMs -->
  <g transform="translate(40, 260)">
    <rect x="0" y="0" width="120" height="30" class="box"/>
    <text x="60" y="20" class="text" text-anchor="middle">GM UK</text>

    <rect x="140" y="0" width="120" height="30" class="box"/>
    <text x="200" y="20" class="text" text-anchor="middle">GM Nordic</text>

    <rect x="280" y="0" width="140" height="30" class="box"/>
    <text x="350" y="20" class="text" text-anchor="middle">GM Aus & Canada</text>
  </g>

  <!-- UK Mgmt -->
  <g transform="translate(80, 320)">
    <rect x="0" y="0" width="160" height="30" class="box"/>
    <text x="80" y="20" class="text" text-anchor="middle">UK Mgmt. Team</text>

    <rect x="180" y="0" width="140" height="30" class="box"/>
    <text x="250" y="20" class="text" text-anchor="middle">Market Manager</text>

    <rect x="330" y="0" width="160" height="30" class="box"/>
    <text x="410" y="20" class="text" text-anchor="middle">Installation Specialist</text>
  </g>

  <!-- Consultants -->
  <g transform="translate(10, 390)">
    <rect x="0" y="0" width="160" height="30" class="box"/>
    <text x="80" y="20" class="text" text-anchor="middle">Senior PM</text>

    <rect x="180" y="0" width="60" height="30" class="box"/>
    <text x="210" y="20" class="text" text-anchor="middle">AM</text>

    <rect x="250" y="0" width="60" height="30" class="box"/>
    <text x="280" y="20" class="text" text-anchor="middle">AM</text>

    <rect x="320" y="0" width="60" height="30" class="box"/>
    <text x="350" y="20" class="text" text-anchor="middle">AM</text>

    <rect x="390" y="0" width="60" height="30" class="box"/>
    <text x="420" y="20" class="text" text-anchor="middle">AM</text>

    <rect x="460" y="0" width="180" height="30" class="box"/>
    <text x="550" y="20" class="text" text-anchor="middle">Implementation Consultant</text>

    <rect x="650" y="0" width="200" height="30" class="box"/>
    <text x="750" y="20" class="text" text-anchor="middle">Graduate Implementation Consultant</text>
  </g>

  <!-- Senior Consultants -->
  <g transform="translate(20, 440)">
    <rect x="0" y="0" width="160" height="30" class="box"/>
    <text x="80" y="20" class="text" text-anchor="middle">Senior Consultant</text>

    <rect x="180" y="0" width="160" height="30" class="box"/>
    <text x="260" y="20" class="text" text-anchor="middle">Senior Consultant</text>

    <rect x="360" y="0" width="160" height="30" class="box"/>
    <text x="440" y="20" class="text" text-anchor="middle">Senior Consultant</text>

    <rect x="540" y="0" width="160" height="30" class="box"/>
    <text x="620" y="20" class="text" text-anchor="middle">Senior Consultant</text>
  </g>

  <!-- Developers and Tech -->
  <g transform="translate(50, 500)">
    <rect x="0" y="0" width="180" height="30" class="box"/>
    <text x="90" y="20" class="text" text-anchor="middle">Senior System Developer</text>

    <rect x="200" y="0" width="180" height="30" class="box"/>
    <text x="290" y="20" class="text" text-anchor="middle">Senior System Developer</text>

    <rect x="400" y="0" width="160" height="30" class="box"/>
    <text x="480" y="20" class="text" text-anchor="middle">Technical Consultant</text>

    <rect x="570" y="0" width="160" height="30" class="box"/>
    <text x="650" y="20" class="text" text-anchor="middle">Technical Consultant</text>
  </g>
</svg>